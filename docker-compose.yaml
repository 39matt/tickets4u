services:
  postgresql:
    container_name: postgresql
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./tools/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./tools/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog_service:
    container_name: catalog_service
    build:
      context: ./services/catalog_service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "123456"
      DB_NAME: postgres
      DB_SSLMODE: disable

volumes:
  pgdata:

